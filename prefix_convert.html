<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mattezoo – Omvandla prefix</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#eef2f7;
    margin:0;
    padding:24px 14px 40px;
  }
  #app{
    max-width:980px;
    margin:0 auto;
    background:#fff;
    border-radius:14px;
    box-shadow:0 6px 22px rgba(0,0,0,0.09);
    border-top:6px solid #4CAF50;
    padding:18px 18px 22px;
    position:relative;
  }
  h1{margin:0 0 6px; color:#2e7d32;}
  p{margin:8px 0 12px; line-height:1.35;}
  .muted{color:#566; font-size:14px;}

  #starPill{
    position:absolute; top:14px; right:14px;
    background:#fffde7;
    border:1px solid #ffe082;
    border-radius:999px;
    padding:7px 12px;
    display:flex; align-items:center; gap:8px;
    font-weight:800; color:#f57f17;
  }
  #starPill span{font-size:18px;}

  .row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    margin-top:8px;
  }

  .pill{
    background:#f1f8e9;
    border:2px solid #c5e1a5;
    color:#1b5e20;
    border-radius:999px;
    padding:6px 10px;
    font-weight:900;
    font-size:14px;
  }

  select, input, button{
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #cfcfcf;
    font-size:16px;
  }
  button{
    border:none;
    background:#4CAF50;
    color:#fff;
    cursor:pointer;
    font-weight:900;
  }
  button:hover{background:#43a047;}
  button.secondary{background:#546e7a;}
  button.secondary:hover{background:#455a64;}
  button:disabled{opacity:.55; cursor:not-allowed;}

  #gameBox{
    margin-top:12px;
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:12px;
    padding:14px;
  }

  #prompt{
    font-size:28px;
    font-weight:900;
    text-align:center;
    margin:6px 0 10px;
    color:#223;
  }

  #ruleLine{
    text-align:center;
    margin:0 0 12px;
    font-weight:900;
    color:#1b5e20;
    background:#e8f5e9;
    border:1px solid #c8e6c9;
    border-radius:12px;
    padding:10px 12px;
  }

  #answerRow{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  #answer{
    width:220px;
    text-align:center;
    font-size:20px;
    border-radius:999px;
  }
  #feedback{
    text-align:center;
    min-height:50px;
    margin-top:10px;
    font-weight:900;
  }
  .ok{color:#16a34a; font-size:18px;}
  .bad{color:#dc2626; font-size:40px; line-height:1;}
  .hint{color:#334; font-size:14px; font-weight:900;}
  .reveal{
    margin-top:8px;
    display:inline-block;
    background:#fff3e0;
    border:1px solid #ffcc80;
    color:#6d4c41;
    border-radius:999px;
    padding:6px 10px;
    font-weight:900;
    font-size:14px;
  }

  .tiny{
    font-size:12px;
    color:#556;
    font-weight:800;
    margin-top:10px;
  }
</style>
</head>
<body>

<div id="app">
  <div id="starPill"><span>⭐</span> <span id="starsText">0</span></div>

  <h1>🔁 Omvandla prefix</h1>
  <p class="muted">
    Du får stjärnor när du klarar <b>10 omvandlingar</b>.
    <br><b>Lätt</b> = 1⭐, <b>Medel</b> = 2⭐, <b>Svår</b> = 3⭐.
    <br>Tips: Skriv med <b>komma</b> eller <b>punkt</b> (båda funkar).
  </p>

  <div class="row">
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
      <div>
        <div class="muted" style="font-weight:900; margin-bottom:6px;">Välj nivå</div>
        <select id="levelSelect">
          <option value="easy">Lätt (1⭐)</option>
          <option value="medium">Medel (2⭐)</option>
          <option value="hard">Svår (3⭐)</option>
        </select>
      </div>

      <button id="startBtn" class="secondary">Starta omgång</button>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <div class="pill">Fråga: <span id="qIdx">0</span> / 10</div>
      <div class="pill">Fel på denna: <span id="wrongThis">0</span> / 3</div>
    </div>
  </div>

  <div id="gameBox" style="display:none;">
    <div id="prompt">—</div>
    <div id="ruleLine">—</div>

    <div id="answerRow">
      <input id="answer" type="text" inputmode="decimal" placeholder="Skriv svar" />
      <button id="okBtn">OK</button>
      <button id="againBtn" class="secondary" style="display:none;">Kör igen</button>
      <button id="backBtn" class="secondary">⬅️ Tillbaka</button>
    </div>

    <div id="feedback"></div>
    <div class="tiny" id="footNote"></div>
  </div>
</div>

<!-- Om de finns: funkar fint. Om de saknas: spelet funkar ändå. -->
<script src="daily.js"></script>
<script src="today.js"></script>

<script>
/* =========================
   MATTEZOO-KEYS
========================= */
const KEY_STARS = "mathZooStars";

/* =========================
   UNITS + FACTORS
   faktor = hur många "basenheter" per enhet
   (längd bas: meter, volym bas: liter, massa bas: gram)
========================= */
const UNITS = {
  length: [
    { u:"mm", f:0.001 }, { u:"cm", f:0.01 }, { u:"m", f:1 }, { u:"km", f:1000 }
  ],
  volume: [
    { u:"ml", f:0.001 }, { u:"dl", f:0.1 }, { u:"l", f:1 }
  ],
  mass: [
    { u:"g", f:1 }, { u:"hg", f:100 }, { u:"kg", f:1000 }
  ]
};

/* =========================
   STATE
========================= */
let stars = 0;

let level = "easy";
let tasks = [];          // 10 tasks
let taskIndex = 0;
let wrongThis = 0;
let roundDone = false;

/* current task */
let cur = null;          // { cat, fromU, toU, val, ans }

/* =========================
   UI refs
========================= */
const starsText = document.getElementById("starsText");
const levelSelect = document.getElementById("levelSelect");
const startBtn = document.getElementById("startBtn");
const gameBox = document.getElementById("gameBox");

const promptDiv = document.getElementById("prompt");
const ruleLine = document.getElementById("ruleLine");
const answerInput = document.getElementById("answer");
const okBtn = document.getElementById("okBtn");
const againBtn = document.getElementById("againBtn");
const backBtn = document.getElementById("backBtn");

const feedbackDiv = document.getElementById("feedback");
const qIdxSpan = document.getElementById("qIdx");
const wrongThisSpan = document.getElementById("wrongThis");
const footNote = document.getElementById("footNote");

/* =========================
   Helpers
========================= */
function loadStars(){
  stars = parseInt(localStorage.getItem(KEY_STARS) || "0", 10);
  if(Number.isNaN(stars)) stars = 0;
  starsText.textContent = String(stars);
}
function addStars(n){
  stars += n;
  localStorage.setItem(KEY_STARS, JSON.stringify(stars));
  starsText.textContent = String(stars);
}

/* Safe calls */
function safeDailyIncrement(type, amount=1){
  try{
    if(typeof window.mzDailyIncrement === "function"){
      window.mzDailyIncrement(type, amount);
    }
  }catch{}
}
function safeTodayIncrement(type, amount=1){
  try{
    if(typeof window.mzTodayIncrement === "function"){
      window.mzTodayIncrement(type, amount);
    }
  }catch{}
}

function randInt(min, max){
  return Math.floor(Math.random()*(max-min+1)) + min;
}
function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}
function shuffle(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* Parse number with comma or dot */
function parseUserNumber(s){
  const t = (s||"").trim().replace(/\s+/g,"").replace(",",".");
  if(t === "") return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

/* Format Swedish-ish (comma) but keep short */
function formatSV(n){
  // avoid -0
  if(Math.abs(n) < 1e-12) n = 0;

  // round to max 6 decimals, then trim
  let s = (Math.round(n * 1e6) / 1e6).toString();

  // if scientific, keep it (rare here)
  if(s.includes("e")) return s.replace(".", ",");

  // trim trailing zeros
  if(s.includes(".")){
    s = s.replace(/0+$/,"").replace(/\.$/,"");
  }
  return s.replace(".", ",");
}

/* Compute conversion: val * fromFactor / toFactor */
function convert(val, fromF, toF){
  return val * (fromF / toF);
}

/* Rule line generator */
function ruleText(toU, fromU){
  // Base relation message: "km är 1000 m" etc.
  const rel = {
    "km": { base:"m",  k:1000 },
    "m":  { base:"m",  k:1 },
    "cm": { base:"m",  k:0.01 },
    "mm": { base:"m",  k:0.001 },

    "l":  { base:"l",  k:1 },
    "dl": { base:"l",  k:0.1 },
    "ml": { base:"l",  k:0.001 },

    "kg": { base:"g",  k:1000 },
    "hg": { base:"g",  k:100 },
    "g":  { base:"g",  k:1 }
  };

  const to = rel[toU];
  const from = rel[fromU];
  if(!to || !from) return "Flytta decimaltecknet utifrån prefixet.";

  // We explain using TO-unit relation to base:
  // If converting to unit that is larger (like km): divide by 1000 (relative to base).
  // If converting to smaller (like cm): multiply by 100.
  // We can decide operation from val_in_base = val * from.k (if base differs, but we used base)
  // For simplicity, use ratio fromF/toF.
  const fromF = from.k;
  const toF   = to.k;
  const ratio = fromF / toF;

  if(Math.abs(ratio - 1) < 1e-12){
    return `${toU} och ${fromU} är samma storlek här, så svaret blir samma tal.`;
  }
  if(ratio < 1){
    // example: from km to m: fromF/toF = 1000/1 = 1000 (ratio >1). so not here
    // ratio < 1 means going to "bigger unit" (m -> km) or from smaller to bigger
    const divBy = 1/ratio;
    return `${toU} är större än ${fromU}, så dela med ${formatSV(divBy)}.`;
  } else {
    return `${toU} är mindre än ${fromU}, så multiplicera med ${formatSV(ratio)}.`;
  }
}

/* =========================
   Task generation (10 st)
========================= */
function genTask(level){
  // Pick category based on level
  let cats = ["length","volume","mass"];
  if(level === "easy") cats = ["length","volume","mass"];
  if(level === "medium") cats = ["length","volume","mass"];
  if(level === "hard") cats = ["length","volume","mass"];

  const cat = pick(cats);

  // Allowed units per level
  let units = UNITS[cat];
  if(level === "easy"){
    // keep very friendly pairs
    if(cat === "length") units = UNITS.length.filter(x => ["m","km"].includes(x.u));
    if(cat === "volume") units = UNITS.volume.filter(x => ["l","dl"].includes(x.u));
    if(cat === "mass")   units = UNITS.mass.filter(x => ["g","kg"].includes(x.u));
  } else if(level === "medium"){
    if(cat === "length") units = UNITS.length.filter(x => ["mm","cm","m","km"].includes(x.u));
    if(cat === "volume") units = UNITS.volume.filter(x => ["ml","dl","l"].includes(x.u));
    if(cat === "mass")   units = UNITS.mass.filter(x => ["g","hg","kg"].includes(x.u));
  } else { // hard
    units = UNITS[cat]; // full set for that cat
  }

  // Choose from/to different
  let fromU = pick(units);
  let toU = pick(units);
  while(toU.u === fromU.u){
    toU = pick(units);
  }

  // Choose value with "nice" outputs depending on level
  // We'll generate in FROM unit, but ensure answer not too messy.
  let val, ans;

  function tryMake(){
    // pick magnitude ranges by category
    if(level === "easy"){
      if(cat === "length"){
        // m<->km round-friendly
        if(fromU.u === "m" && toU.u === "km"){
          val = randInt(100, 9000); // divisible by 1000 not guaranteed, but ok
          // prefer divisible by 100 or 1000 sometimes
          if(Math.random() < 0.6) val = randInt(1, 9) * 1000;
        } else if(fromU.u === "km" && toU.u === "m"){
          val = randInt(1, 9);
        } else {
          val = randInt(1, 1000);
        }
      }
      if(cat === "volume"){
        // l<->dl: keep one decimal at most
        if(fromU.u === "l" && toU.u === "dl"){
          val = randInt(1, 25) / 10; // 0.1..2.5
        } else if(fromU.u === "dl" && toU.u === "l"){
          val = randInt(1, 30); // 1..30 dl -> 0.1..3.0 l
        } else {
          val = randInt(1, 20);
        }
      }
      if(cat === "mass"){
        // g<->kg: keep clean
        if(fromU.u === "g" && toU.u === "kg"){
          val = randInt(1, 9) * 1000;
        } else if(fromU.u === "kg" && toU.u === "g"){
          val = randInt(1, 9);
        } else {
          val = randInt(1, 5000);
        }
      }
    }

    if(level === "medium"){
      // a bit more variety, still mostly tidy
      if(cat === "length"){
        val = randInt(1, 5000);
        if(fromU.u === "km") val = randInt(1, 25) / 10; // 0.1..2.5 km
      }
      if(cat === "volume"){
        val = randInt(1, 900);
        if(fromU.u === "l") val = randInt(1, 40) / 10; // 0.1..4.0 l
      }
      if(cat === "mass"){
        val = randInt(1, 9000);
        if(fromU.u === "kg") val = randInt(1, 50) / 10; // 0.1..5.0 kg
      }
    }

    if(level === "hard"){
      // allow decimals, still keep it solvable without ugly floats
      // choose value with up to 2 decimals
      const base = randInt(1, 9000);
      const dec = Math.random() < 0.55 ? (randInt(0,99)/100) : 0;
      val = base/10 + dec; // 0.1..900.9-ish
      // sometimes integer too
      if(Math.random() < 0.35) val = randInt(1, 9999);

      // keep reasonable magnitude for km/kg to avoid giant numbers
      if(fromU.u === "km") val = randInt(1, 250) / 100; // 0.01..2.50
      if(fromU.u === "kg") val = randInt(1, 250) / 100; // 0.01..2.50
      if(fromU.u === "l")  val = randInt(1, 400) / 100; // 0.01..4.00
    }

    ans = convert(val, fromU.f, toU.f);
  }

  // Try a few times to get a "nice" answer (not too many decimals)
  for(let tries=0; tries<25; tries++){
    tryMake();
    const rounded = Math.round(ans * 1000) / 1000;
    const err = Math.abs(ans - rounded);
    if(level === "easy"){
      // prefer <= 1 decimal or integer
      const rounded1 = Math.round(ans * 10) / 10;
      if(Math.abs(ans - rounded1) < 1e-9) break;
    } else if(level === "medium"){
      // prefer <= 2 decimals
      const rounded2 = Math.round(ans * 100) / 100;
      if(Math.abs(ans - rounded2) < 1e-9) break;
    } else {
      // allow up to 3 decimals
      if(err < 1e-9) break;
    }
  }

  return {
    cat,
    fromU: fromU.u,
    toU: toU.u,
    fromF: fromU.f,
    toF: toU.f,
    val,
    ans
  };
}

function buildRound(level){
  const out = [];
  for(let i=0;i<10;i++){
    out.push(genTask(level));
  }
  return out;
}

/* =========================
   Game flow
========================= */
function startRound(){
  level = levelSelect.value;
  tasks = buildRound(level);
  taskIndex = 0;
  wrongThis = 0;
  roundDone = false;
  cur = tasks[0];

  gameBox.style.display = "block";
  againBtn.style.display = "none";
  okBtn.disabled = false;

  feedbackDiv.textContent = "";
  feedbackDiv.className = "";
  answerInput.value = "";
  answerInput.focus();

  renderTask();
}

function renderTask(){
  qIdxSpan.textContent = String(taskIndex + 1);
  wrongThisSpan.textContent = String(wrongThis);

  const valSV = formatSV(cur.val);
  promptDiv.textContent = `Omvandla: ${valSV} ${cur.fromU} → ${cur.toU}`;

  ruleLine.textContent = ruleText(cur.toU, cur.fromU);

  feedbackDiv.textContent = "";
  feedbackDiv.className = "";
  footNote.textContent = "";
}

function awardStarsForLevel(){
  if(level === "easy") return 1;
  if(level === "medium") return 2;
  return 3;
}

function finishRound(){
  roundDone = true;
  const earned = awardStarsForLevel();
  addStars(earned);

  // Prefix progress hooks (om du vill koppla in senare)
  safeDailyIncrement("prefix", 1);
  safeTodayIncrement("prefix", 1);

  feedbackDiv.textContent = `🎉 Omgång klar! Du fick ${earned} ⭐.`;
  feedbackDiv.className = "ok";
  footNote.textContent = "Kör igen för att träna mer, eller byt nivå.";

  okBtn.disabled = true;
  againBtn.style.display = "inline-block";
  answerInput.blur();
}

function nextTask(){
  taskIndex += 1;
  wrongThis = 0;

  if(taskIndex >= tasks.length){
    finishRound();
    return;
  }

  cur = tasks[taskIndex];
  answerInput.value = "";
  answerInput.focus();
  renderTask();
}

function showReveal(){
  const ansSV = formatSV(cur.ans);
  footNote.innerHTML = `<span class="reveal">Rätt svar: <b>${ansSV}</b> ${cur.toU}</span>`;
}

function isCorrect(user, correct){
  // tight tolerance
  return Math.abs(user - correct) < 1e-9;
}

function checkAnswer(){
  if(roundDone) return;

  const user = parseUserNumber(answerInput.value);
  if(user === null){
    feedbackDiv.textContent = " ";
    feedbackDiv.className = "bad";
    return;
  }

  if(isCorrect(user, cur.ans)){
    feedbackDiv.textContent = "Rätt!";
    feedbackDiv.className = "ok";
    footNote.textContent = "";

    setTimeout(nextTask, 450);
  } else {
    wrongThis += 1;
    wrongThisSpan.textContent = String(wrongThis);

    feedbackDiv.textContent = "✖";
    feedbackDiv.className = "bad";

    // efter 3 fel: visa rätt svar (men de måste fortfarande skriva det för att gå vidare)
    if(wrongThis >= 3){
      showReveal();
      feedbackDiv.className = "hint";
      feedbackDiv.textContent = "Nu ser du rätt svar. Skriv det för att gå vidare 🙂";
    }

    // välj inte ny fråga automatiskt (det här blir mer “träna tills rätt”)
    answerInput.focus();
    answerInput.select();
  }
}

/* =========================
   Events
========================= */
startBtn.addEventListener("click", startRound);
okBtn.addEventListener("click", checkAnswer);
answerInput.addEventListener("keydown", (e)=>{
  if(e.key === "Enter") checkAnswer();
});
againBtn.addEventListener("click", startRound);
backBtn.addEventListener("click", ()=> location.href = "index.html");

/* =========================
   Init
========================= */
document.addEventListener("DOMContentLoaded", ()=>{
  loadStars();
});
</script>
</body>
</html>
